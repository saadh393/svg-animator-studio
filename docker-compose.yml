name: svg-animator

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: backend_prod
    environment:
      - NODE_ENV=production
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: frontend_prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

networks:
  default:
    name: svg-animator-net

